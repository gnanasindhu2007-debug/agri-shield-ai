<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Crop Result | AGRI-SHIELD AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f8ef;
    color:#17351d;
}

nav{
    height:70px;
    background:#063514;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6%;
    color:white;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.home-btn{
    color:white;
    text-decoration:none;
    background:#2f7e3c;
    padding:11px 18px;
    border-radius:9px;
    font-weight:700;
}

.container{
    width:92%;
    max-width:850px;
    margin:35px auto 50px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header-icon{
    font-size:55px;
}

.header h1{
    color:#174b24;
    font-size:32px;
    margin:8px 0;
}

.header p{
    color:#607064;
    font-size:16px;
}

.card{
    background:white;
    padding:28px;
    border-radius:22px;
    box-shadow:0 15px 45px rgba(20,70,25,.12);
}

.crop-image{
    width:100%;
    max-height:330px;
    object-fit:contain;
    border-radius:16px;
    background:#edf5e9;
    margin-bottom:25px;
}

/* RESULT */

.result-box{
    text-align:center;
    background:#fff4e5;
    border:2px solid #f1d5a8;
    border-radius:18px;
    padding:25px 18px;
    margin-bottom:20px;
}

.result-box .label{
    color:#85602b;
    font-size:14px;
    font-weight:800;
    margin-bottom:10px;
}

.disease{
    color:#7a351f;
    font-size:28px;
    font-weight:800;
    margin-bottom:15px;
}

.severity{
    display:inline-block;
    background:#ffe1df;
    color:#b3261e;
    padding:9px 18px;
    border-radius:25px;
    font-weight:800;
}

/* ACTION */

.action-box{
    background:#eaf7e6;
    border:2px solid #cde5c5;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
}

.action-box h2{
    color:#20582c;
    font-size:22px;
    margin-bottom:18px;
}

.action{
    background:white;
    padding:17px;
    border-radius:12px;
    margin-bottom:10px;
    color:#435246;
    line-height:1.6;
    font-size:15px;
}

/* VOICE */

.voice-btn{
    width:100%;
    border:none;
    padding:16px;
    margin-top:8px;
    border-radius:11px;
    background:#2f7e3c;
    color:white;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

.voice-btn:hover{
    background:#205f2c;
}

/* CROP */

.crop-box{
    background:#f7faf6;
    border:1px solid #dce8d9;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
}

.crop-box h3{
    color:#286238;
    margin-bottom:8px;
}

.crop-box p{
    color:#526157;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:12px;
}

.button{
    flex:1;
    padding:16px;
    border-radius:11px;
    text-align:center;
    text-decoration:none;
    font-weight:800;
}

.another{
    background:#2f7e3c;
    color:white;
}

.home{
    background:#edf4ea;
    color:#286238;
}

/* MOBILE */

@media(max-width:600px){

    .card{
        padding:18px;
    }

    .header h1{
        font-size:27px;
    }

    .disease{
        font-size:23px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>
</head>


<body>

<nav>

    <div class="logo">
        🌱 AGRI-SHIELD AI
    </div>

    <a href="index.html" class="home-btn">
        🏠 Home
    </a>

</nav>


<div class="container">

    <div class="header">

        <div class="header-icon">
            🌱
        </div>

        <h1>
            Your Crop Check Result
        </h1>

        <p>
            We checked your crop photo. Here is what you should do.
        </p>

    </div>


    <div class="card">

        <!-- PHOTO -->

        <img
            id="cropImage"
            class="crop-image"
            alt="Your crop photo"
        >


        <!-- CROP -->

        <div class="crop-box">

            <h3>
                🌿 Your Crop
            </h3>

            <p id="cropName">
                Tomato
            </p>

        </div>


        <!-- PROBLEM -->

        <div class="result-box">

            <div class="label">
                ⚠️ PROBLEM FOUND IN YOUR CROP
            </div>

            <div
                class="disease"
                id="diseaseName">

                Checking...

            </div>

            <div
                class="severity"
                id="severity">

                Please wait

            </div>

        </div>


        <!-- WHAT TO DO -->

        <div class="action-box">

            <h2>
                💡 What should you do now?
            </h2>

            <div
                class="action"
                id="action1">

                🌿 Please wait...

            </div>

            <div
                class="action"
                id="action2">

            </div>

            <div
                class="action"
                id="action3">

            </div>

            <button
                class="voice-btn"
                onclick="listenAdvice()">

                🔊 Listen to Advice

            </button>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <a
                href="upload.html"
                class="button another">

                📷 Check Another Crop

            </a>

            <a
                href="index.html"
                class="button home">

                🏠 Go to Home

            </a>

        </div>

    </div>

</div>


<script>

/* GET SAVED RESULT */

const savedResult =
    localStorage.getItem("diagnosisResult");

const savedImage =
    localStorage.getItem("cropImage");


if(!savedResult){

    alert(
        "Please check your crop first."
    );

    window.location.href =
        "upload.html";

}


/* READ RESULT */

const result =
    JSON.parse(savedResult);


/* SHOW IMAGE */

if(savedImage){

    document.getElementById(
        "cropImage"
    ).src = savedImage;

}


/* CROP */

const crop =
    result.crop_name || "Tomato";

document.getElementById(
    "cropName"
).innerText = crop;


/* DISEASE */

let disease =
    result.detected_issue ||
    "Crop problem detected";


/*
   Convert technical disease name
   into farmer-friendly wording.
*/

if(
    disease === "Tomato Bacterial Spot" ||
    disease === "Tomato___Bacterial_spot"
){

    disease =
        "Bacterial spots are affecting your tomato leaves";

}


document.getElementById(
    "diseaseName"
).innerText =
    disease;


/* SEVERITY */

let severity =
    result.severity_level ||
    "Needs attention";


let severityText =
    "⚠️ " + severity;


if(
    severity.toLowerCase() === "high"
){

    severityText =
        "⚠️ Your crop needs quick attention";

}

else if(
    severity.toLowerCase() === "medium"
){

    severityText =
        "⚠️ Your crop needs some attention";

}

else if(
    severity.toLowerCase() === "low"
){

    severityText =
        "🟢 Your crop needs normal care";

}


document.getElementById(
    "severity"
).innerText =
    severityText;


/* =========================
   FARMER FRIENDLY ADVICE
========================= */

let remedy =
    "Remove the affected leaves and keep the crop clean.";


if(
    result.organic_remedies &&
    result.organic_remedies.length > 0
){

    remedy =
        result.organic_remedies[0].description ||
        result.organic_remedies[0].title;

}


/* ACTION 1 */

document.getElementById(
    "action1"
).innerText =
    "🍃 " + remedy;


/* ACTION 2 */

document.getElementById(
    "action2"
).innerText =
    "🗑️ Do not leave infected leaves in the field. Remove and dispose of them safely.";


/* ACTION 3 */

document.getElementById(
    "action3"
).innerText =
    "💧 Avoid keeping the leaves wet for a long time and keep the field clean.";


/* VOICE */

function listenAdvice(){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Voice is not available in this browser."
        );

        return;
    }


    window.speechSynthesis.cancel();


    const text =
        "Your crop is " +
        crop +
        ". " +

        "We found a problem in your crop. " +

        "Your crop needs " +
        severity +
        " attention. " +

        "Please remove the affected leaves and dispose of them safely. " +

        "Do not leave infected leaves in the field. " +

        "Keep your crop clean and avoid keeping the leaves wet for a long time.";


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "en-IN";

    speech.rate =
        0.82;

    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}

</script>

</body>
</html>
