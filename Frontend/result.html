<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Result | AGRI-SHIELD AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f7ef;
    color:#17351d;
    min-height:100vh;
}

/* NAVBAR */

nav{
    height:72px;
    background:#063514;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6%;
    color:white;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.home-btn{
    color:white;
    text-decoration:none;
    background:#2f7e3c;
    padding:11px 18px;
    border-radius:9px;
    font-weight:700;
}

/* MAIN */

.container{
    width:92%;
    max-width:900px;
    margin:35px auto;
}

/* HEADER */

.page-header{
    text-align:center;
    margin-bottom:25px;
}

.page-header .icon{
    font-size:55px;
    margin-bottom:10px;
}

.page-header h1{
    color:#174b24;
    font-size:34px;
    margin-bottom:8px;
}

.page-header p{
    color:#667568;
    font-size:15px;
}

/* RESULT CARD */

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 45px rgba(20,70,25,.12);
    margin-bottom:20px;
}

/* IMAGE */

.crop-image{
    width:100%;
    max-height:300px;
    object-fit:contain;
    border-radius:16px;
    background:#edf5e9;
    margin-bottom:25px;
}

/* MAIN RESULT */

.result-main{
    text-align:center;
    background:#edf8e9;
    border:2px solid #d3eaca;
    border-radius:18px;
    padding:28px 20px;
    margin-bottom:20px;
}

.result-main .small{
    color:#4d7955;
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
}

.disease{
    font-size:30px;
    font-weight:800;
    color:#174b24;
    margin-bottom:12px;
}

.severity{
    display:inline-block;
    padding:9px 18px;
    border-radius:30px;
    background:#ffe6e6;
    color:#b3261e;
    font-weight:800;
}

/* GRID */

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.info-box{
    background:#f8fbf6;
    border:1px solid #dfeade;
    border-radius:15px;
    padding:22px;
}

.info-box h3{
    color:#286238;
    font-size:16px;
    margin-bottom:12px;
}

.info-box p{
    color:#526157;
    line-height:1.7;
    font-size:14px;
}

/* CONFIDENCE */

.confidence-number{
    font-size:27px;
    font-weight:800;
    color:#28743a;
    margin-bottom:10px;
}

.progress{
    height:11px;
    width:100%;
    background:#dfe8dc;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#3b8d46;
    border-radius:20px;
}

/* ACTION */

.action-card{
    background:#eaf5e6;
    border-radius:18px;
    padding:25px;
    margin-top:20px;
    border:1px solid #d5e8ce;
}

.action-card h2{
    color:#20582c;
    font-size:21px;
    margin-bottom:15px;
}

.action{
    background:white;
    padding:16px;
    border-radius:12px;
    margin-bottom:10px;
    color:#445448;
    line-height:1.6;
}

/* VOICE */

.voice-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:11px;
    background:#2f7e3c;
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:10px;
}

.voice-btn:hover{
    background:#205f2c;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.button{
    flex:1;
    padding:15px;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-weight:800;
}

.another{
    background:#2f7e3c;
    color:white;
}

.home{
    background:#edf4ea;
    color:#286238;
}

/* MOBILE */

@media(max-width:650px){

    .info-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:20px;
    }

    .disease{
        font-size:24px;
    }

    .page-header h1{
        font-size:28px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>
</head>


<body>

<nav>

    <div class="logo">
        🌱 AGRI-SHIELD AI
    </div>

    <a href="index.html" class="home-btn">
        🏠 Home
    </a>

</nav>


<div class="container">

    <div class="page-header">

        <div class="icon">
            🌱
        </div>

        <h1 id="pageTitle">
            Your Crop Test Result
        </h1>

        <p id="pageSubtitle">
            Here is what we found from your crop photo.
        </p>

    </div>


    <div class="card">

        <!-- CROP IMAGE -->

        <img
            id="cropImage"
            class="crop-image"
            alt="Uploaded crop image"
        >


        <!-- MAIN RESULT -->

        <div class="result-main">

            <div class="small" id="diagnosisLabel">
                PROBLEM FOUND IN YOUR CROP
            </div>

            <div
                class="disease"
                id="diseaseName">
                Checking...
            </div>

            <div
                class="severity"
                id="severity">
                --
            </div>

        </div>


        <!-- INFORMATION -->

        <div class="info-grid">

            <!-- CROP -->

            <div class="info-box">

                <h3>
                    🌿 Your Crop
                </h3>

                <p id="cropName">
                    --
                </p>

            </div>


            <!-- CONFIDENCE -->

            <div class="info-box">

                <h3>
                    🎯 AI Result
                </h3>

                <div
                    class="confidence-number"
                    id="confidence">
                    --%
                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>

                </div>

            </div>

        </div>


        <!-- WHAT TO DO -->

        <div class="action-card">

            <h2>
                💡 What should you do now?
            </h2>

            <div
                class="action"
                id="recommendation">
                Please wait...
            </div>

            <div
                class="action"
                id="npkAdvice">
            </div>

            <button
                class="voice-btn"
                onclick="listenResult()">

                🔊 Listen to the advice

            </button>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <a
                href="upload.html"
                class="button another">

                📷 Check Another Crop

            </a>

            <a
                href="index.html"
                class="button home">

                🏠 Go to Home

            </a>

        </div>

    </div>

</div>


<script>

/* ===============================
   GET AI RESULT
================================ */

const resultText =
    localStorage.getItem("diagnosisResult");

const imageData =
    localStorage.getItem("cropImage");


if(!resultText){

    alert(
        "No crop result found. Please upload a crop image first."
    );

    window.location.href =
        "upload.html";

}


/* ===============================
   LOAD RESULT
================================ */

const result =
    JSON.parse(resultText);


/* ===============================
   IMAGE
================================ */

if(imageData){

    document.getElementById(
        "cropImage"
    ).src = imageData;

}


/* ===============================
   CROP
================================ */

document.getElementById(
    "cropName"
).innerText =
    result.crop_name || "Tomato";


/* ===============================
   DISEASE
================================ */

document.getElementById(
    "diseaseName"
).innerText =
    result.detected_issue || "Crop problem detected";


/* ===============================
   SEVERITY
================================ */

document.getElementById(
    "severity"
).innerText =
    result.severity_level
    ? "⚠️ " + result.severity_level
    : "⚠️ Needs attention";


/* ===============================
   CONFIDENCE
================================ */

let confidence =
    Number(result.confidence_score || 0);


/*
Backend sends 1.0 for Tomato.
Convert 1.0 to 100%.
*/

if(confidence <= 1){

    confidence =
        confidence * 100;

}

confidence =
    Math.round(confidence);


document.getElementById(
    "confidence"
).innerText =
    confidence + "%";


document.getElementById(
    "progressBar"
).style.width =
    confidence + "%";


/* ===============================
   RECOMMENDATION
================================ */

let recommendation =
    "Please consult a local agricultural expert for further guidance.";


if(
    result.organic_remedies &&
    result.organic_remedies.length > 0
){

    recommendation =
        result.organic_remedies[0].description ||
        result.organic_remedies[0].title;

}


document.getElementById(
    "recommendation"
).innerText =
    "🌿 " + recommendation;


/* ===============================
   NPK ADVICE
================================ */

if(result.npk_advice){

    document.getElementById(
        "npkAdvice"
    ).innerText =
        "🌾 " + result.npk_advice;

}
else{

    document.getElementById(
        "npkAdvice"
    ).style.display =
        "none";

}


/* ===============================
   VOICE
================================ */

function listenResult(){

    if(!("speechSynthesis" in window)){

        alert(
            "Voice support is not available in this browser."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const text =

        "Your crop is " +
        (result.crop_name || "Tomato") +
        ". " +

        "The problem found is " +
        (result.detected_issue || "a crop problem") +
        ". " +

        "The severity is " +
        (result.severity_level || "needs attention") +
        ". " +

        "What you should do is " +
        recommendation +
        ". " +

        (result.npk_advice || "");


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "en-IN";

    speech.rate =
        0.85;

    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}

</script>

</body>
</html>
