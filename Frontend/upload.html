<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Analysis | AGRI-SHIELD AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(5,45,18,.88),
                    rgba(25,100,45,.88)
                ),
                linear-gradient(135deg,#123c1c,#4caf50);
            color: #17351f;
        }

        nav {
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,.18);
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1b5e20;
            margin-bottom: 15px;
        }

        .description {
            color: #68756b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .upload-box {
            padding: 35px 20px;
            border: 2px dashed #4caf50;
            border-radius: 15px;
            background: #f3faf3;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }

    </style>

</head>

<body>

<nav>

    <div class="logo">
        🌱 AGRI-SHIELD AI
    </div>

    <a href="index.html">
        Home
    </a>

</nav>

<div class="container">

    <div class="card">

        <div class="icon">
            🌿
        </div>

        <h1>
            Crop Disease Detection
        </h1>

        <p class="description">
            Upload a clear image of your crop leaf.
            The AI system will analyze the image and
            identify possible crop diseases or pests.
        </p>

        <form action="result.html">

            <div class="upload-box">

                <h3>
                    📷 Select Crop Image
                </h3>

                <br>

                <input
                    type="file"
                    accept="image/png, image/jpeg, image/jpg"
                    required
                >

            </div>

            <button type="submit">
                🔍 Analyze Crop
            </button>

        </form>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
