<script>
/* ================================
   LANGUAGE
================================ */

let currentLanguage =
    localStorage.getItem("selectedLanguage") || "en-IN";


/* ================================
   BEST VOICE FINDER
================================ */

function getBestVoice(language){

    const voices =
        window.speechSynthesis.getVoices();

    if(!voices || voices.length === 0){
        return null;
    }

    const lang =
        language.toLowerCase();

    /* First: exact language match */
    let voice =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase() === lang
        );

    if(voice){
        return voice;
    }

    /* Second: language prefix match */
    const prefix =
        lang.split("-")[0];

    voice =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase().startsWith(prefix)
        );

    return voice || null;
}


/* ================================
   LANGUAGE CHANGE
================================ */

function setLanguage(language){

    currentLanguage = language;

    localStorage.setItem(
        "selectedLanguage",
        language
    );

    /* Your existing UI language code
       goes here */

}


/* ================================
   LISTEN BUTTON
================================ */

function listenInstructions(){

    if(!("speechSynthesis" in window)){

        alert(
            "Voice support is not available in this browser."
        );

        return;
    }


    /* Stop previous voice */

    window.speechSynthesis.cancel();


    let text = "";


    /* ============================
       TELUGU
    ============================ */

    if(currentLanguage === "te-IN"){

        text =
        "మొదట సమస్య ఉన్న పంట ఆకుకు స్పష్టమైన ఫోటో తీయండి. " +
        "మంచి వెలుతురు ఉండేలా చూసుకోండి. " +
        "తర్వాత ఫోటోను ఇక్కడ అప్లోడ్ చేయండి. " +
        "ఫోటో స్పష్టంగా కనిపించిన తర్వాత నా పంటను పరీక్షించండి అనే బటన్ నొక్కండి. " +
        "మీ పంటను పరిశీలించి, సమస్య ఏమిటో మరియు తరువాత ఏం చేయాలో మేము చెబుతాము.";

    }


    /* ============================
       HINDI
    ============================ */

    else if(currentLanguage === "hi-IN"){

        text =
        "सबसे पहले जिस पत्ती में समस्या है उसकी साफ फोटो लें। " +
        "अच्छी रोशनी रखें। " +
        "फिर फोटो यहां अपलोड करें। " +
        "फोटो साफ दिखाई देने के बाद मेरी फसल जांचें बटन दबाएं। " +
        "हम आपकी फसल की जांच करके बताएंगे कि समस्या क्या है और आगे क्या करना चाहिए।";

    }


    /* ============================
       ENGLISH
    ============================ */

    else{

        text =
        "First, take a clear photo of the affected crop leaf. " +
        "Make sure there is good light. " +
        "Then upload the photo here. " +
        "After the photo is ready, press Check My Crop. " +
        "We will check your crop and tell you what the problem is and what you should do next.";

    }


    /* ============================
       CREATE SPEECH
    ============================ */

    const speech =
        new SpeechSynthesisUtterance(text);


    /* VERY IMPORTANT */

    speech.lang =
        currentLanguage;


    speech.rate =
        0.80;


    speech.pitch =
        1.0;


    speech.volume =
        1.0;


    /* ============================
       SELECT CORRECT VOICE
    ============================ */

    const voice =
        getBestVoice(currentLanguage);


    if(voice){

        speech.voice =
            voice;

        console.log(
            "Selected voice:",
            voice.name,
            voice.lang
        );

    }


    /* ============================
       SPEAK
    ============================ */

    window.speechSynthesis.speak(
        speech
    );

}


/* ================================
   LOAD BROWSER VOICES
================================ */

window.speechSynthesis.onvoiceschanged =
    function(){

        console.log(
            "Available voices:",
            window.speechSynthesis.getVoices()
        );

    };


/* ================================
   STOP VOICE WHEN LEAVING
================================ */

window.addEventListener(
    "beforeunload",
    function(){

        window.speechSynthesis.cancel();

    }
);

</script>
