<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Crop Image | AGRI-SHIELD AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

<body>

    <!-- NAVBAR -->
    <nav>

        <div class="logo">
            🌱 AGRI-SHIELD AI
        </div>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </nav>


    <!-- MAIN -->
    <div class="container">

        <h2>Crop Disease Detection</h2>

        <p class="subtitle">
            Upload a clear leaf photo of the affected crop
            to get instant AI-powered analysis.
        </p>


        <!-- UPLOAD AREA -->
        <label for="cropImage" class="upload-box" id="dropArea">

            <div class="icon">
                📷
            </div>

            <div class="upload-title">
                Click or Drag Image Here to Upload
            </div>

            <div class="upload-info">
                Supports JPG, JPEG and PNG • Maximum 5MB
            </div>

            <input
                type="file"
                id="cropImage"
                accept="image/jpeg,image/png,image/jpg"
                onchange="previewFile()"
            >

            <img
                id="preview"
                class="preview-img"
                alt="Crop Leaf Preview"
            >

        </label>


        <!-- ANALYZE BUTTON -->
        <button
            class="submit-btn"
            id="analyzeButton"
            onclick="analyzeCrop()"
        >
            🔍 Analyze Crop Leaf
        </button>


        <!-- STATUS -->
        <div id="status"></div>

    </div>


    <!-- FOOTER -->
    <footer>
        © 2026 AGRI-SHIELD AI | Smart Farming Assistant
    </footer>


    <script>

        /* =========================
           IMAGE PREVIEW
        ========================= */

        function previewFile() {

            const fileInput = document.getElementById("cropImage");
            const preview = document.getElementById("preview");
            const status = document.getElementById("status");

            const file = fileInput.files[0];

            if (!file) {
                return;
            }

            /* Check file size */

            if (file.size > 5 * 1024 * 1024) {

                alert("Image size must be less than 5MB.");

                fileInput.value = "";
                preview.style.display = "none";

                return;
            }


            /* Show preview */

            const reader = new FileReader();

            reader.onload = function (event) {

                preview.src = event.target.result;
                preview.style.display = "block";

                status.style.display = "none";
            };

            reader.readAsDataURL(file);
        }



        /* =========================
           ANALYZE CROP
        ========================= */

        async function analyzeCrop() {

            const fileInput =
                document.getElementById("cropImage");

            const button =
                document.getElementById("analyzeButton");

            const status =
                document.getElementById("status");


            /* Check image */

            if (!fileInput.files.length) {

                alert(
                    "Please select a crop leaf image first!"
                );

                return;
            }


            const file = fileInput.files[0];


            /* Check file size */

            if (file.size > 5 * 1024 * 1024) {

                alert(
                    "Image size must be less than 5MB."
                );

                return;
            }


            /* Create FormData */

            const formData = new FormData();

            formData.append(
                "crop_name",
                "Tomato"
            );

            formData.append(
                "file",
                file
            );


            /* Loading */

            button.disabled = true;

            button.innerHTML =
                "⏳ Analyzing with AI...";

            status.style.display = "block";

            status.style.color = "#438c4e";

            status.innerHTML =
                "🌱 AI is analyzing your crop image...";


            try {

                /* Send image to FastAPI backend */

                const response = await fetch(
                    "http://127.0.0.1:8000/api/v1/diagnosis/scan",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                /* Check response */

                if (!response.ok) {

                    throw new Error(
                        "Backend server returned an error."
                    );
                }


                /* Convert response to JSON */

                const result =
                    await response.json();


                console.log(
                    "AI Result:",
                    result
                );


                /* Save result */

                localStorage.setItem(
                    "diagnosisResult",
                    JSON.stringify(result)
                );


                /* Save uploaded image */

                const reader =
                    new FileReader();

                reader.onload = function (event) {

                    localStorage.setItem(
                        "cropImage",
                        event.target.result
                    );

                    /* Open result page */

                    window.location.href =
                        "result.html";
                };

                reader.readAsDataURL(file);


            } catch (error) {

                console.error(error);


                status.style.color = "#c62828";

                status.innerHTML =
                    "❌ Unable to connect to AI model.";


                alert(
                    "Unable to connect to AI model. Please make sure the backend server is running."
                );


                /* Reset button */

                button.disabled = false;

                button.innerHTML =
                    "🔍 Analyze Crop Leaf";
            }

        }


        /* =========================
           DRAG & DROP
        ========================= */

        const dropArea =
            document.getElementById("dropArea");

        const fileInput =
            document.getElementById("cropImage");


        dropArea.addEventListener(
            "dragover",
            function (event) {

                event.preventDefault();

                dropArea.style.background =
                    "#edf8e9";

                dropArea.style.borderColor =
                    "#438c4e";
            }
        );


        dropArea.addEventListener(
            "dragleave",
            function () {

                dropArea.style.background =
                    "#f8fbf7";

                dropArea.style.borderColor =
                    "#91d96d";
            }
        );


        dropArea.addEventListener(
            "drop",
            function (event) {

                event.preventDefault();


                dropArea.style.background =
                    "#f8fbf7";

                dropArea.style.borderColor =
                    "#91d96d";


                const files =
                    event.dataTransfer.files;


                if (files.length > 0) {

                    fileInput.files = files;

                    previewFile();
                }
            }
        );

    </script>

</body>

</html>
