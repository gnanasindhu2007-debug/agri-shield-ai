<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Crop Image | AGRI-SHIELD AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8f1;
            color: #17351d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        nav {
            height: 76px;
            background: rgba(5, 38, 17, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6%;
            color: white;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            color: #a8ed82;
            text-decoration: none;
            font-weight: 700;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(20, 60, 25, 0.1);
            text-align: center;
        }

        h2 {
            font-size: 28px;
            color: #163b1d;
            margin-bottom: 10px;
        }

        p {
            color: #627265;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .upload-box {
            border: 2px dashed #91d96d;
            background: #f8fbf7;
            padding: 40px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-box:hover {
            background: #edf8e9;
            border-color: #438c4e;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .submit-btn {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: #91d96d;
            border: none;
            border-radius: 10px;
            color: #102b17;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #7cc957;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🌱 AGRI-SHIELD AI</div>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </nav>

    <div class="container">
        <h2>Crop Disease Detection</h2>
        <p>Upload a clear leaf photo of the affected crop to get instant AI analysis.</p>

        <label for="cropImage" class="upload-box" id="dropArea">
            <div class="icon">📷</div>
            <strong style="color: #24552b;">Click or Drag image here to upload</strong>
            <p style="margin-top: 5px; font-size: 12px;">Supports JPG, PNG (Max 5MB)</p>
            <input type="file" id="cropImage" accept="image/*" onchange="previewFile()">
            <img id="preview" class="preview-img" alt="Leaf Preview">
        </label>

        <button class="submit-btn" onclick="analyzeCrop()">🔍 Analyze Crop Leaf</button>
    </div>

    <script>
        function previewFile() {
            const preview = document.getElementById('preview');
            const file = document.getElementById('cropImage').files[0];
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                preview.src = reader.result;
                preview.style.display = "block";
            }, false);

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        function analyzeCrop() {
            const fileInput = document.getElementById('cropImage');
            if (!fileInput.files.length) {
                alert("Please select or take a photo of a crop leaf first!");
                return;
            }
            alert("Leaf uploaded! Connecting to AI Model for processing...");
        }
    </script>

</body>

</html>
